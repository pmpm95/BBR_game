<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>챌린지 관리자</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .admin { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 16px; }
      .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .admin input[type='password'] { border: 0; background: var(--surface-2); border-radius: 999px; padding: 9px 14px; font-size: 15px; }
      .status-rejected td { color: var(--red); }
      .status-playing td { color: var(--muted); }
      .btn-danger { background: #fde7e7; color: var(--red); }
    </style>
  </head>
  <body>
    <div class="admin">
      <h1>🍫 챌린지 관리자</h1>
      <div class="panel row">
        <input type="password" id="pw" placeholder="관리자 비밀번호" />
        <button class="btn btn-primary btn-sm" id="load">불러오기</button>
        <a class="btn btn-ghost btn-sm" href="/">← 메인</a>
      </div>
      <div id="content" hidden>
        <div class="panel row">
          <span id="frozen"></span>
          <button class="btn btn-sm" id="toggle"></button>
          <button class="btn btn-sm" id="csv">CSV 내보내기</button>
          <button class="btn btn-sm btn-danger" id="reset">전체 기록 초기화</button>
        </div>
        <div class="panel table-wrap" style="margin-top: 16px">
          <table class="rank-table" id="table"></table>
        </div>
      </div>
    </div>
    <script type="module">
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const GAME = { cards: '카드', stopwatch: '11.11초', pepero: '11.11km' };
      const STATUS = { done: '완료', playing: '진행/중단', rejected: '거절' };
      let pw = sessionStorage.getItem('pp_admin') || '';
      $('#pw').value = pw;

      async function call(method, url, body) {
        const res = await fetch(url, {
          method,
          headers: { 'x-admin-password': pw, ...(body ? { 'Content-Type': 'application/json' } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
        return res;
      }

      async function load() {
        pw = $('#pw').value;
        try {
          const s = await (await call('GET', '/api/admin/state')).json();
          sessionStorage.setItem('pp_admin', pw);
          $('#content').hidden = false;
          $('#frozen').innerHTML = s.frozen
            ? '<span class="pill pill-red">마감됨</span>'
            : '<span class="pill pill-live"><i></i>진행 중</span>';
          $('#frozen').innerHTML += s.eventEnd ? ` 자동 마감: ${new Date(s.eventEnd).toLocaleString('ko-KR')}` : '';
          $('#toggle').textContent = s.manualFrozen ? '마감 해제' : '지금 마감(랭킹 동결)';
          $('#toggle').onclick = async () => {
            await call('POST', '/api/admin/frozen', { frozen: !s.manualFrozen });
            load();
          };
          const rows = [...s.attempts].reverse();
          $('#table').innerHTML =
            '<thead><tr><th>시작</th><th>이름</th><th>게임</th><th>상태</th><th>기록</th><th class="num">점수</th><th></th></tr></thead><tbody>' +
            rows
              .map(
                (a) => `<tr class="status-${a.status}">
                  <td>${new Date(a.createdAt).toLocaleString('ko-KR')}</td>
                  <td>${esc(a.name)}</td><td>${GAME[a.game]}</td>
                  <td>${STATUS[a.status]}${a.rejectReason ? ` (${esc(a.rejectReason)})` : ''}</td>
                  <td>${esc(a.display ?? '')}</td><td class="num">${a.score ?? ''}</td>
                  <td><button class="btn btn-sm btn-danger" data-del="${a.id}" title="삭제하면 기회 1회가 복구됩니다">삭제</button></td>
                </tr>`,
              )
              .join('') +
            '</tbody>';
          document.querySelectorAll('[data-del]').forEach(
            (b) =>
              (b.onclick = async () => {
                if (!confirm('이 기록을 삭제할까요? (해당 참가자의 기회 1회가 복구됩니다)')) return;
                await call('DELETE', `/api/admin/attempts/${b.dataset.del}`);
                load();
              }),
          );
        } catch (e) {
          alert(e.message);
        }
      }

      $('#load').onclick = load;
      $('#pw').onkeydown = (e) => e.key === 'Enter' && load();
      $('#reset').onclick = async () => {
        if (prompt('모든 기록이 삭제됩니다. 계속하려면 "초기화"를 입력하세요.') !== '초기화') return;
        await call('POST', '/api/admin/reset');
        load();
      };
      $('#csv').onclick = async () => {
        const blob = await (await call('GET', '/api/admin/export.csv')).blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pepero-results.csv';
        a.click();
      };
      if (pw) load();
    </script>
  </body>
</html>
