<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>빼빼로데이 챌린지</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-sticks" aria-hidden="true"><i></i><i></i></span>
        <div>
          <h1>빼빼로데이 챌린지</h1>
          <p class="sub">11.11 · 게임별 3번 도전 · 종합 TOP 3 시상 🎁</p>
        </div>
      </div>
      <div class="auth" data-auth></div>
    </header>

    <main class="layout">
      <section class="games" aria-label="게임 목록" data-games></section>

      <section class="board" aria-label="랭킹 대시보드">
        <div class="board-head">
          <h2>🏆 실시간 랭킹</h2>
          <div class="board-status" data-status></div>
        </div>
        <div class="tabs" role="tablist" data-tabs></div>
        <div class="podium" data-podium></div>
        <div class="table-wrap"><table class="rank-table" data-table></table></div>
      </section>
    </main>

    <div class="overlay" data-overlay hidden>
      <div class="overlay-panel" role="dialog" aria-modal="true">
        <div class="overlay-head">
          <h3 data-overlay-title></h3>
          <button class="icon-btn" data-overlay-close tabindex="-1" aria-label="닫기">✕</button>
        </div>
        <div class="stage" data-stage></div>
      </div>
    </div>

    <div class="toast" data-toast hidden></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
